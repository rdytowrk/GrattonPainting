# Prompt Configuration
# Define prompt templates and their variations

prompts:
  base_v1:
    file: prompts/base/conversion_v1.md
    description: "Base HTML to Tailwind conversion prompt"
    active: true
    parameters:
      temperature: 0.7
      max_tokens: 8000
      top_p: 0.95
    metadata:
      created: "2025-12-20"
      author: "system"
      version: "1.0.0"
    tags:
      - base
      - production

