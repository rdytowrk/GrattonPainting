name: Test Prompt Changes

on:
  push:
    branches:
      - main
      - 'cursor/**'
    paths:
      - 'prompts/**'
      - 'config/prompts.yaml'
  pull_request:
    paths:
      - 'prompts/**'
      - 'config/prompts.yaml'
  workflow_dispatch:
    inputs:
      prompt_name:
        description: 'Prompt name to test (leave empty for all active prompts)'
        required: false
        default: ''
      test_category:
        description: 'Test category to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - simple
          - medium
          - complex

jobs:
  test-prompts:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Fetch current and previous commit for comparison
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Verify installation
        run: |
          python --version
          pip list | grep -E "(google-generativeai|pydantic|beautifulsoup4|click)"
      
      - name: Check which prompts changed
        id: check-prompts
        run: |
          echo "Checking for prompt changes..."
          git diff --name-only HEAD^ HEAD | grep -E "^prompts/|^config/prompts.yaml" || echo "No prompt changes"
          
          # Get list of changed prompts
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD | grep -E "^prompts/" || echo "")
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          
          if [ -n "$CHANGED_FILES" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Initialize harness (if no test cases exist)
        run: |
          if [ ! -f test_cases/metadata.json ] || [ $(jq '.total_cases' test_cases/metadata.json) -eq 0 ]; then
            echo "No test cases found. Running initialization..."
            python scripts/init_harness.py || true
          else
            echo "Test cases already exist. Skipping initialization."
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      
      - name: List available test cases
        id: check-tests
        run: |
          echo "=== Available Test Cases ==="
          python scripts/list_test_cases.py --stats
          
          # Check if we have any test cases
          TEST_COUNT=$(python scripts/list_test_cases.py --stats | grep "Total test cases:" | awk '{print $4}')
          echo "test_count=$TEST_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "⚠️ No test cases available. Skipping test execution."
            echo "has_tests=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Found $TEST_COUNT test case(s)"
            echo "has_tests=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Determine prompt to test
        id: determine-prompt
        run: |
          if [ -n "${{ github.event.inputs.prompt_name }}" ]; then
            PROMPT_NAME="${{ github.event.inputs.prompt_name }}"
            echo "Using manual prompt: $PROMPT_NAME"
          else
            # Extract prompt name from changed files or use default
            CHANGED_FILES="${{ steps.check-prompts.outputs.changed_files }}"
            if [ -n "$CHANGED_FILES" ]; then
              # Try to extract prompt name from path (e.g., prompts/variations/experiment_001.md -> experiment_001)
              PROMPT_NAME=$(echo "$CHANGED_FILES" | head -1 | sed -n 's|prompts/.*/\(.*\)\.md|\1|p')
              if [ -z "$PROMPT_NAME" ]; then
                PROMPT_NAME="base_v1"
              fi
            else
              PROMPT_NAME="base_v1"
            fi
            echo "Using prompt: $PROMPT_NAME"
          fi
          echo "prompt_name=$PROMPT_NAME" >> $GITHUB_OUTPUT
      
      - name: Test API connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Testing Gemini API connection..."
          python scripts/test_gemini_api.py || echo "⚠️ API test failed but continuing..."
      
      - name: Run tests
        id: run-tests
        if: steps.check-tests.outputs.has_tests == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PROMPT_NAME="${{ steps.determine-prompt.outputs.prompt_name }}"
          TEST_CATEGORY="${{ github.event.inputs.test_category || 'all' }}"
          
          echo "Running tests with prompt: $PROMPT_NAME"
          
          if [ "$TEST_CATEGORY" = "all" ]; then
            python scripts/run_tests.py \
              --all \
              --prompt "$PROMPT_NAME" \
              --description "CI test run for $PROMPT_NAME on Python ${{ matrix.python-version }}" \
              --verbose || echo "Tests completed with some failures"
          else
            python scripts/run_tests.py \
              --category "$TEST_CATEGORY" \
              --prompt "$PROMPT_NAME" \
              --description "CI test run for $PROMPT_NAME ($TEST_CATEGORY tests) on Python ${{ matrix.python-version }}" \
              --verbose || echo "Tests completed with some failures"
          fi
          
          # Get the latest run ID
          RUN_ID=$(ls -t results/runs/ | head -1)
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Generate report
        if: always() && steps.run-tests.outputs.run_id != ''
        run: |
          RUN_ID="${{ steps.run-tests.outputs.run_id }}"
          echo "Generating report for run: $RUN_ID"
          
          python scripts/generate_report.py \
            --run "$RUN_ID" \
            --format markdown \
            --output "results/reports/ci_report_$RUN_ID.md"
          
          python scripts/generate_report.py \
            --run "$RUN_ID" \
            --format json \
            --output "results/reports/ci_report_$RUN_ID.json"
          
          echo "Report generated successfully"
      
      - name: Display report summary
        if: always() && steps.run-tests.outputs.run_id != ''
        run: |
          RUN_ID="${{ steps.run-tests.outputs.run_id }}"
          REPORT_FILE="results/reports/ci_report_$RUN_ID.md"
          
          if [ -f "$REPORT_FILE" ]; then
            echo "=== Test Report Summary ==="
            head -50 "$REPORT_FILE"
            echo ""
            echo "Full report saved as artifact"
          fi
      
      - name: Check test results
        if: always() && steps.run-tests.outputs.run_id != ''
        run: |
          RUN_ID="${{ steps.run-tests.outputs.run_id }}"
          REPORT_JSON="results/reports/ci_report_$RUN_ID.json"
          
          if [ -f "$REPORT_JSON" ]; then
            PASSED=$(jq '.summary.passed_evaluations' "$REPORT_JSON")
            TOTAL=$(jq '.summary.total_tests' "$REPORT_JSON")
            AVG_SCORE=$(jq '.summary.average_weighted_score' "$REPORT_JSON")
            
            echo "Test Results:"
            echo "  Passed: $PASSED/$TOTAL"
            echo "  Average Score: $AVG_SCORE"
            
            if [ "$PASSED" -eq "$TOTAL" ]; then
              echo "✅ All tests passed!"
              exit 0
            else
              echo "⚠️ Some tests failed"
              exit 1
            fi
          else
            echo "❌ No report found"
            exit 1
          fi
      
      - name: Upload test results
        if: always() && steps.run-tests.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            results/runs/
            results/reports/
          retention-days: 30
      
      - name: Upload test reports
        if: always() && steps.run-tests.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: results/reports/ci_report_*
          retention-days: 30
      
      - name: Create summary when no tests available
        if: steps.check-tests.outputs.has_tests != 'true'
        run: |
          echo "# ⚠️ No Test Cases Available" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No test cases were found to run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Add test cases using:" >> $GITHUB_STEP_SUMMARY
          echo '   ```bash' >> $GITHUB_STEP_SUMMARY
          echo '   python scripts/add_test_case.py --url https://example.com --name "Test"' >> $GITHUB_STEP_SUMMARY
          echo '   ```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. Or run initialization:" >> $GITHUB_STEP_SUMMARY
          echo '   ```bash' >> $GITHUB_STEP_SUMMARY
          echo '   python scripts/init_harness.py' >> $GITHUB_STEP_SUMMARY
          echo '   ```' >> $GITHUB_STEP_SUMMARY

  compare-with-baseline:
    runs-on: ubuntu-latest
    needs: test-prompts
    if: github.event_name == 'pull_request' && needs.test-prompts.result == 'success'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Download test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        id: download
        with:
          name: test-results-python-3.9
          path: results/
      
      - name: Compare with baseline
        id: compare
        if: steps.download.outcome == 'success'
        run: |
          # Check if results directory exists and has runs
          if [ ! -d "results/runs" ] || [ -z "$(ls -A results/runs 2>/dev/null)" ]; then
            echo "No test runs found in artifacts"
            echo "has_comparison=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Get the two most recent runs
          RUNS=($(ls -t results/runs/ | head -2))
          
          if [ ${#RUNS[@]} -eq 2 ]; then
            echo "Comparing runs: ${RUNS[0]} vs ${RUNS[1]}"
            python scripts/generate_report.py \
              --compare "${RUNS[0]},${RUNS[1]}" \
              --output "results/reports/comparison.md"
            
            echo "has_comparison=true" >> $GITHUB_OUTPUT
          else
            echo "Not enough runs to compare (found ${#RUNS[@]} run(s))"
            echo "has_comparison=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create PR summary without comparison
        if: steps.download.outcome != 'success' || steps.compare.outputs.has_comparison != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const message = `## 🧪 Prompt Test Results
            
            Tests have been executed. Artifacts were not available for comparison.
            
            This may be because:
            - This is the first test run
            - No test cases have been added yet
            - The tests didn't complete successfully
            
            **Next steps:**
            1. Add test cases: \`python scripts/add_test_case.py --url <url> --name "Test"\`
            2. Run the workflow again
            
            ---
            *Automated by GitHub Actions*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
      
      - name: Comment PR with comparison
        if: steps.compare.outputs.has_comparison == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comparison = fs.readFileSync('results/reports/comparison.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🧪 Prompt Test Results\n\n${comparison}\n\n---\n*Automated by GitHub Actions*`
            });
